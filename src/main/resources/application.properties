spring.application.name=bpo-microservicio-ia

# Configuracion de base de datos H2
spring.datasource.url=jdbc:h2:file:./data/bpo_ai_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuracion de JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Consola web de H2 (para entorno local)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Bloqueo temporal de la autoconfiguracion de OpenAI
spring.ai.openai.api-key=${OPENAI_API_KEY:dummy}