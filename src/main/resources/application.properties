spring.config.import=optional:file:.env[.properties]
spring.application.name=bpo-microservicio-ia

# Configuracion de base de datos H2
spring.datasource.url=jdbc:h2:file:./data/bpo_ai_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuracion de JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Consola web de H2 (para entorno local)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Selección del proveedor de IA
ai.provider=${AI_PROVIDER:groq}
ai.model=${AI_MODEL:openai/gpt-oss-120b}

# Conexión de Spring AI con Groq
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.api-key=${GROQ_API_KEY:}
spring.ai.openai.chat.options.model=openai/gpt-oss-120b
